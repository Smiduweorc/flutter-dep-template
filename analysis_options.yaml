include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - comment_references
    - prefer_double_quotes
    - public_member_api_docs
    - unawaited_futures
    - unnecessary_library_name
