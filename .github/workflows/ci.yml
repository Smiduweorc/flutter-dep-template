name: CI

on:
  push:
    branches: [master, dev]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Analyze, Test & Package (${{ matrix.os }}, flutter ${{ matrix.flutter-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The first entry is the floor declared in pubspec.yaml; keep them in
        # step.
        flutter-version: [3.47.x, any]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter ${{ matrix.flutter-version }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Builds the example against the package's public entry point, the way
      # a consuming app imports it.
      - name: Analyze example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze

      # Validates what `flutter pub publish` would upload: pubspec fields,
      # .pubignore, file layout. Does not publish. Until release.sh has run
      # once, CHANGELOG.md has no entry for 0.0.0 and pub rejects that, so the
      # step is skipped for the unreleased template.
      - name: Validate package
        if: matrix.os == 'ubuntu-latest'
        run: |
          if grep -qx 'version: 0.0.0' pubspec.yaml; then
            echo "Skipped: version 0.0.0 has not been released."
          else
            flutter pub publish --dry-run
          fi
